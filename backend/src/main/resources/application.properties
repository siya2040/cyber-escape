spring.application.name=cyberescape

# Port configuration - dynamic for cloud environments (Render injects PORT)
server.port=${PORT:8080}

# Datasource configuration - dynamic for cloud database connections, falls back to H2 locally
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cyberescape;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate settings
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console - accessible locally at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
